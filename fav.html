<html>
<body>

<div id="favorites-menu" class="fav-menu">
    <h2>Your Favorites</h2>
    <div id="favorite-list"></div>
    <button onclick="goBack()">Go Back</button>
</div>

<style>
    .fav-menu {
        max-width: 100%;
        margin: 0 auto;
        padding: 20px;
        background-color: #ffffff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    #favorite-list {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: space-between;
    }

    #favorite-list > div {
        flex: 1 1 calc(50% - 20px);
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #fefefe;
        position: relative;
        box-sizing: border-box;
        min-height: 200px;
    }

    #favorite-list > div > .remove-btn {
        margin-bottom: 10px;
    }

    .remove-btn {
        display: inline-block;
        padding: 8px 12px;
        margin-top: 10px;
        background-color: #e74c3c;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        width: 80px;
    }

    .remove-btn:hover {
        background-color: #c0392b;
    }

    button {
        display: block;
        width: 100%;
        max-width: 200px;
        margin: 20px auto 0;
        padding: 10px;
        background-color: #3498db;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        text-align: center;
    }

    button:hover {
        background-color: #2980b9;
    }
</style>

<script>
function openFavorites() {
    const favoriteList = document.getElementById('favorite-list');
    favoriteList.innerHTML = '';

    const favorites = JSON.parse(localStorage.getItem('favorites')) || [];

    favorites.forEach((favoriteHTML, index) => {
        const div = document.createElement('div');
        div.innerHTML = favoriteHTML;

        const removeButton = document.createElement('button');
        removeButton.textContent = 'Remove';
        removeButton.classList.add('remove-btn');

        removeButton.addEventListener('click', function () {
            removeFavorite(index, div);
        });

        div.appendChild(removeButton);
        favoriteList.appendChild(div);
    });
}

function removeFavorite(index, packageDiv) {
    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    favorites.splice(index, 1);
    localStorage.setItem('favorites', JSON.stringify(favorites));
    packageDiv.remove();
}

document.addEventListener('DOMContentLoaded', openFavorites);

function goBack() {
    window.history.back();
}
</script>

</body>
</html>
